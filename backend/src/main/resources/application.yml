server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: amir-babyshop

  datasource:
    url: jdbc:mysql://localhost:3306/amir_babyshop?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

app:
  jwt:
    secret: ${JWT_SECRET:amir-babyshop-dev-secret-change-me-in-prod-must-be-32-chars-min}
    access-token-ttl: 3600000
    refresh-token-ttl: 2592000000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:4173,http://*:*}
  default-tenant: UH6Z4CXU
  push:
    vapid:
      public: "BPzSLOIkNsBWxdduSfVd0E6NdjhNM0JbxOVSM_7JfIEgnhJ8So25Vq4YtCr4iOuDd2YD_qdebfMaR7aflS1tFfY"
      private: "Vu16607UQD3ZBDjlLG1VeQVTEz7wbCOrMPOC1NSmaFA"
    subject: "mailto:xabiiib0790@gmail.com"

springdoc:
  api-docs:
    path: /docs
  swagger-ui:
    path: /swagger

logging:
  level:
    co.ke.amirbabyshop: DEBUG
    org.hibernate.SQL: WARN